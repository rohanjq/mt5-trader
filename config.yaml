# MT5 Auto-Trader Configuration
# This file is hot-reloaded — changes to trading.volume take effect immediately.

mt5:
  host: localhost
  port: 8001

trading:
  symbol: BTCUSDT
  volume: 0.001        # fixed lot size (hot-reloadable)
  magic: 100
  deviation: 20
  filling: FOK
  sl_dollars: 100.0    # SL = $100 from entry (e.g. 61600 → SL 61500)
  reward_ratio: 1.25   # TP = SL × ratio = $125 from entry

signals:
  poll_interval: 2.0   # seconds between signal reads
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    - indicator: utbot
      timeframes: [M1, M3, M15, M45]
    - indicator: dc
      timeframes: [M15, M45]

filters:
  cooldown_minutes: 5
  max_consecutive_losses: 3
  pause_after_consecutive_minutes: 15
  max_daily_loss: 500.0
  reversal_cooldown_seconds: 60    # block reverse direction for 60s after close

exit_rules:
  signal_reversal_exit: false        # let TP/SL hit instead of closing on signal flip
  breakeven_trigger_dollars: 50.0    # move SL to entry when price moves $50
  trailing_stop_dollars: 0.0         # trail SL at this $ distance (0 = off)

rules:
  utbot_simple:
    enabled: true                    # simple 1m UT Bot signal for testing
    timeframe: M1
  dc_confluence:
    enabled: false                   # disabled for testing
    dc_timeframe: M15
    ut_entry_timeframe: M1
    ut_trend_timeframe: M45
    min_trend_bars: 5
  dc_wick_rejection:
    enabled: false                   # disabled for testing
    dc_timeframe: M15
    ut_timeframe: M3
  utbot_multi_tf:
    enabled: false                   # disabled for testing
    entry_timeframe: M1
    mid_timeframe: M15
    trend_timeframe: M45

logging:
  level: INFO
