# MT5 Auto-Trader Configuration
# This file is hot-reloaded — changes to trading.volume take effect immediately.

mt5:
  host: localhost
  port: 8001

trading:
  symbol: BTCUSDT
  volume: 0.001        # fixed lot size (hot-reloadable)
  magic: 100
  deviation: 20
  filling: FOK
  sl_dollars: 100.0    # SL = $100 from entry (e.g. 61600 → SL 61500)
  reward_ratio: 1.25   # TP = SL × ratio = $125 from entry

signals:
  poll_interval: 2.0   # seconds between signal reads
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    - indicator: utbot
      timeframes: [M1, M3, M15, M45]
    - indicator: dc
      timeframes: [M15, M45]

filters:
  cooldown_minutes: 5
  max_consecutive_losses: 3
  pause_after_consecutive_minutes: 15
  max_daily_loss: 500.0
  reversal_cooldown_seconds: 60    # block reverse direction for 60s after close

exit_rules:
  signal_reversal_exit: false        # let TP/SL hit instead of closing on signal flip
  breakeven_trigger_dollars: 50.0    # move SL to entry when price moves $50
  trailing_stop_dollars: 0.0         # trail SL at this $ distance (0 = off)

rules:
  # ── Python-based rules (in rules/*.py) ──
  utbot_simple:
    enabled: true                    # simple 1m UT Bot signal for testing
    timeframe: M1
  dc_confluence:
    enabled: false
  dc_wick_rejection:
    enabled: false
  utbot_multi_tf:
    enabled: false

  # ── Expression rules (YAML-defined, no Python needed) ──
  # Format: signal_name.field_name OPERATOR value
  # Operators: ==, !=, >, >=, <, <=, in, not_in, is, is_not
  # All conditions are ANDed. Buy and sell are separate.
  expressions:
    - name: ut_m1_with_m15_trend
      enabled: false
      priority: 140
      description: "UT 1m signal + 15m trend alignment"
      buy:
        - utbot_M1.closed_signal == BUY
        - utbot_M15.closed_bias == BULLISH
      sell:
        - utbot_M1.closed_signal == SELL
        - utbot_M15.closed_bias == BEARISH

    - name: dc_zone_ut_entry
      enabled: false
      priority: 105
      description: "DC zone + UT Bot signal + trend bars"
      buy:
        - dc_M15.closed_price_zone in LOWER,LOWER_MID
        - utbot_M1.closed_signal == BUY
        - utbot_M45.consecutive_bull_bars >= 5
      sell:
        - dc_M15.closed_price_zone in UPPER,UPPER_MID
        - utbot_M1.closed_signal == SELL
        - utbot_M45.consecutive_bear_bars >= 5

    - name: dc_wick_ut_bias
      enabled: false
      priority: 115
      description: "DC wick rejection + UT Bot bias"
      buy:
        - dc_M15.closed_lower_wick_rej is TRUE
        - utbot_M3.closed_bias == BULLISH
      sell:
        - dc_M15.closed_upper_wick_rej is TRUE
        - utbot_M3.closed_bias == BEARISH

    - name: full_alignment
      enabled: false
      priority: 90
      description: "All TFs aligned + DC zone + UT signal"
      buy:
        - utbot_M1.closed_signal == BUY
        - utbot_M15.closed_bias == BULLISH
        - utbot_M45.closed_bias == BULLISH
        - dc_M15.closed_price_zone in LOWER,LOWER_MID,MID
      sell:
        - utbot_M1.closed_signal == SELL
        - utbot_M15.closed_bias == BEARISH
        - utbot_M45.closed_bias == BEARISH
        - dc_M15.closed_price_zone in UPPER,UPPER_MID,MID

logging:
  level: INFO
