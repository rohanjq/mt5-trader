# MT5 Auto-Trader Configuration
# This file is hot-reloaded — changes to trading.volume take effect immediately.

mt5:
  host: localhost
  port: 8001

trading:
  symbol: BTCUSDT
  volume: 0.001        # fixed lot size (hot-reloadable)
  magic: 100
  deviation: 20
  filling: FOK
  sl_dollars: 100.0    # SL = $100 from entry (e.g. 61600 → SL 61500)
  reward_ratio: 1.25   # TP = SL × ratio = $125 from entry

signals:
  poll_interval: 2.0   # seconds between signal reads
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    - indicator: utbot
      timeframes: [M1, M3, M15, M45]
    - indicator: dc
      timeframes: [M15, M45]

filters:
  cooldown_minutes: 5
  max_consecutive_losses: 3
  pause_after_consecutive_minutes: 15
  max_daily_loss: 500.0
  reversal_cooldown_seconds: 60    # block reverse direction for 60s after close

exit_rules:
  signal_reversal_exit: false        # let TP/SL hit instead of closing on signal flip
  breakeven_trigger_dollars: 50.0    # move SL to entry when price moves $50
  trailing_stop_dollars: 0.0         # trail SL at this $ distance (0 = off)

rules:
  # ── All Python rules disabled ──
  utbot_simple:
    enabled: false
  dc_confluence:
    enabled: false
  dc_wick_rejection:
    enabled: false
  utbot_multi_tf:
    enabled: false

  # ── Expression rules (YAML only) ──
  expressions:
    # UT 3m signal + 1m consecutive bars + 45m trend
    - name: "3m_trend_sell"
      enabled: true
      priority: 100
      description: "UT 3m signal + 1m bear bars + 45m trend"
      buy:
        - utbot_M3.closed_signal == BUY
        - utbot_M1.consecutive_bull_bars >= 2
        - utbot_M45.closed_bias == BULLISH
      sell:
        - utbot_M3.closed_signal == SELL
        - utbot_M1.consecutive_bear_bars >= 2
        - utbot_M45.closed_bias == BEARISH

    # UT 1m signal + DC zone near mid (mean reversion)
    - name: "1m_dc_mid_reversal"
      enabled: true
      priority: 110
      description: "UT 1m signal + price near DC mid zone"
      buy:
        - utbot_M1.closed_signal == BUY
        - dc_M15.closed_price_zone in LOWER_MID,MID
      sell:
        - utbot_M1.closed_signal == SELL
        - dc_M15.closed_price_zone in UPPER_MID,MID

    # UT 1m + 3m bias aligned (frequent)
    - name: "1m_3m_align"
      enabled: true
      priority: 130
      description: "UT 1m signal + 3m bias aligned"
      buy:
        - utbot_M1.closed_signal == BUY
        - utbot_M3.closed_bias == BULLISH
      sell:
        - utbot_M1.closed_signal == SELL
        - utbot_M3.closed_bias == BEARISH

    # UT 1m signal alone (most frequent, fallback)
    - name: "1m_signal_only"
      enabled: true
      priority: 200
      description: "UT 1m signal only"
      buy:
        - utbot_M1.closed_signal == BUY
      sell:
        - utbot_M1.closed_signal == SELL

logging:
  level: INFO
