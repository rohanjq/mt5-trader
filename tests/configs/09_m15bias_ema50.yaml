mt5:
  host: localhost
  port: 8001
trading:
  symbol: XAUUSD
  volume: 0.25
  risk_pct: 5.0
  max_volume: 10.0
  min_volume: 0.01
  magic: 200
  deviation: 20
  filling: FOK
  multi_position: true
  sl_dollars: 5.0
  reward_ratio: 1.25
signals:
  poll_interval: 2.0
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
  - indicator: utbot
    timeframes:
    - M1
    - M3
    - M5
    - M15
  - indicator: dc
    timeframes:
    - M1
    - M5
    - M15
  - indicator: ema9
    timeframes:
    - M1
  - indicator: ema21
    timeframes:
    - M1
    - M5
  - indicator: ema50
    timeframes:
    - M5
    - M15
  - indicator: ema200
    timeframes:
    - M5
    - M15
  - indicator: rsi14
    timeframes:
    - M1
    - M5
    - M15
  - indicator: rsi2
    timeframes:
    - M1
  - indicator: adx14
    timeframes:
    - M1
    - M5
  - indicator: macd12_26_9
    timeframes:
    - M1
  - indicator: stoch5_3_3
    timeframes:
    - M1
  - indicator: bb20d2
    timeframes:
    - M1
  - indicator: atr14
    timeframes:
    - M1
    - M5
  - indicator: vwap
    timeframes:
    - M1
    - M5
filters:
  cooldown_seconds: 30
  max_consecutive_losses: 0
  pause_after_consecutive_minutes: 15
  max_daily_loss: -1
  reversal_cooldown_seconds: 30
exit_rules:
  signal_reversal_exit: false
  breakeven_pct: 0.0
  partial_tp: false
  tp_close_pct: 100.0
  trailing_stop_dollars: 0.0
notifications:
  enabled: false
rules:
  expressions:
  - name: utbot_buy_09_m15bias_ema50
    enabled: true
    priority: 50
    sl_dollars: 5.0
    reward_ratio: 1.25
    breakeven_pct: 0.0
    partial_tp: false
    description: M15 UT Bot bias + EMA50 M15 above
    buy:
    - utbot_M1.closed_signal == BUY
    - utbot_M15.closed_bias == BULLISH
    - ema50_M15.closed_price_vs_ema == ABOVE
    sell:
    - utbot_M1.closed_signal == BUY
    - utbot_M1.closed_signal == SELL
