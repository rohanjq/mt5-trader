# MT5 Auto-Trader — XAUUSD Gold Configuration
# Usage: python main.py --config config-gold.yaml

mt5:
  host: localhost
  port: 8001

trading:
  symbol: XAUUSD
  volume: 0.25           # fallback if risk sizing fails
  risk_pct: 5.0          # risk 5% of account balance per trade (hot-reloadable)
  max_volume: 10.0       # safety cap
  min_volume: 0.01       # broker minimum
  magic: 200             # separate magic from BTC (100)
  deviation: 20
  filling: FOK
  multi_position: true
  sl_dollars: 5.0         # default SL = $5.00 move (overridable per strategy)
  reward_ratio: 1.0        # default TP = SL × 1.0 (1:1 risk-reward)

signals:
  poll_interval: 2.0
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    # ── Core indicators ──
    - indicator: utbot
      timeframes: [M1, M2, M3, M5, M10, M15, M30, M45, H1, H4]
    - indicator: dc
      timeframes: [M1, M2, M3, M5, M10, M15, M30, M45, H1, H4]
    # ── EMA family ──
    - indicator: ema9
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema21
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema50
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema200
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Oscillators ──
    - indicator: rsi14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: rsi2
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: adx14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: macd12_26_9
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: stoch5_3_3
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Volatility / bands ──
    - indicator: bb20d2
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: atr14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Session VWAP ──
    - indicator: vwap
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]

filters:
  cooldown_seconds: 30          # per-trade cooldown
  max_consecutive_losses: 0      # disabled
  pause_after_consecutive_minutes: 0
  max_daily_loss: -1
  reversal_cooldown_seconds: 30  # reversal cooldown

exit_rules:
  signal_reversal_exit: false
  breakeven_pct: 0.0            # disabled
  partial_tp: false             # disabled — no runners
  tp_close_pct: 100.0           # close 100% at TP
  trailing_stop_dollars: 0.0

notifications:
  enabled: false
  pushover_user_key: ""    # set via PUSHOVER_USER env var
  pushover_app_token: ""    # set via PUSHOVER_TOKEN env var

rules:
  expressions:
    # ══════════════════════════════════════════════════════════
    # Strategy 1: UT Bot multi-TF trend (DISABLED — PF 0.95)
    # ══════════════════════════════════════════════════════════
    - name: "gold_utbot_trend"
      enabled: false
      priority: 50
      sl_dollars: 5.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "UT Bot M1 signal + M5/M15 trend alignment + VWAP"
      buy:
        - utbot_M1.closed_signal == BUY
        - utbot_M5.closed_bias == BULLISH
        - utbot_M15.closed_bias == BULLISH
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - utbot_M1.closed_signal == SELL
        - utbot_M5.closed_bias == BEARISH
        - utbot_M15.closed_bias == BEARISH
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 2: DC Compression Breakout (DISABLED — PF 0.95)
    # ══════════════════════════════════════════════════════════
    - name: "gold_dc_breakout"
      enabled: false
      priority: 40
      sl_dollars: 6.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "Compression breakout (DC+BB squeeze → expansion)"
      buy:
        - ema50_M5.closed_price_vs_ema == ABOVE
        - ema200_M5.closed_price_vs_ema == ABOVE
        - dc_M1.dc_compressed is TRUE
        - bb20d2_M1.bb_squeeze is TRUE
        - atr14_M1.volatility_state in EXPANDING,ABOVE_AVG
        - dc_M1.closed_price_zone == UPPER
        - adx14_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - ema50_M5.closed_price_vs_ema == BELOW
        - ema200_M5.closed_price_vs_ema == BELOW
        - dc_M1.dc_compressed is TRUE
        - bb20d2_M1.bb_squeeze is TRUE
        - atr14_M1.volatility_state in EXPANDING,ABOVE_AVG
        - dc_M1.closed_price_zone == LOWER
        - adx14_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 3: M2 SELL 2nd Wave — EMA50 + bounce + VWAP
    # Backtest: PF 1.80, WR 64.7%, DD 10.4%, 34 trades
    # ══════════════════════════════════════════════════════════
    - name: "trend_2w_m2_ema50_bounce2_vwap"
      enabled: true
      priority: 50
      sl_dollars: 5.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M2 SELL + EMA50 M5 below + M5 bounced 2+ bars + VWAP (no M15)"
      buy:
        - FALSE
      sell:
        - utbot_M2.closed_signal == SELL
        - ema50_M5.closed_price_vs_ema == BELOW
        - utbot_M5.consecutive_bull_bars >= 2
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 4: M2 SELL 2nd Wave — M15 bear + bounce + VWAP
    # Backtest: PF 1.62, WR 62.5%, DD 9.7%, 24 trades
    # ══════════════════════════════════════════════════════════
    - name: "trend_2w_m2_m15bear_bounce2_vwap"
      enabled: true
      priority: 50
      sl_dollars: 5.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M2 SELL + M15 bearish + M5 bounced 2+ bars + VWAP"
      buy:
        - FALSE
      sell:
        - utbot_M2.closed_signal == SELL
        - utbot_M15.closed_bias == BEARISH
        - utbot_M5.consecutive_bull_bars >= 2
        - vwap_M1.closed_price_vs_vwap == BELOW
