# MT5 Auto-Trader — XAUUSD Gold Configuration
# Usage: python main.py --config config-gold.yaml

mt5:
  host: localhost
  port: 8001

trading:
  symbol: XAUUSD
  volume: 0.25           # fallback if risk sizing fails
  risk_pct: 5.0          # risk 5% of account balance per trade (hot-reloadable)
  max_volume: 10.0       # safety cap
  min_volume: 0.01       # broker minimum
  magic: 200
  deviation: 20
  filling: FOK
  multi_position: false
  sl_dollars: 5.0         # default SL = $5.00 move (overridable per strategy)
  reward_ratio: 1.0        # default TP = SL × 1.0 (1:1 risk-reward)

signals:
  poll_interval: 2.0
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    # ── Core indicators ──
    - indicator: utbot
      timeframes: [M1, M2, M3, M5, M10, M15, M30, M45, H1, H4]
    - indicator: dc
      timeframes: [M1, M2, M3, M5, M10, M15, M30, M45, H1, H4]
    # ── EMA family ──
    - indicator: ema9
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema21
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema50
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: ema200
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Oscillators ──
    - indicator: rsi14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: rsi2
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: adx14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: macd12_26_9
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: stoch5_3_3
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Volatility / bands ──
    - indicator: bb20d2
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    - indicator: atr14
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Session VWAP ──
    - indicator: vwap
      timeframes: [M1, M2, M3, M5, M10, M15, M30, H1, H4]
    # ── Candle analysis ──
    - indicator: candle
      timeframes: [M1, M2, M3, M5, M10, M15, M30]
    # ── Liquidity Grab ──
    - indicator: liqgrab
      timeframes: [M3, M5, M15, H1]

filters:
  cooldown_seconds: 30          # per-trade cooldown
  max_consecutive_losses: 0      # disabled
  pause_after_consecutive_minutes: 0
  max_daily_loss: -1
  reversal_cooldown_seconds: 30  # reversal cooldown

exit_rules:
  signal_reversal_exit: false
  breakeven_pct: 0.0            # disabled
  partial_tp: false             # disabled — no runners
  tp_close_pct: 100.0           # close 100% at TP
  trailing_stop_dollars: 0.0

notifications:
  enabled: false
  pushover_user_key: ""    # set via PUSHOVER_USER env var
  pushover_app_token: ""    # set via PUSHOVER_TOKEN env var

rules:
  expressions:
    # ══════════════════════════════════════════════════════════
    # Strategy 1: DC Wick Rejection (PF 1.31, DD 30.8%, 60 trades)
    # DC M15 wick rejection + UT Bot M3 bias
    # Live: 3 wins in session 2026-06-09
    # ══════════════════════════════════════════════════════════
    - name: "dc_wick_rejection"
      enabled: true
      priority: 110
      sl_dollars: 5.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "DC M15 wick rejection + UT Bot M3 bias"
      buy:
        - dc_M15.closed_lower_wick_rej is TRUE
        - utbot_M3.closed_bias == BULLISH
      sell:
        - dc_M15.closed_upper_wick_rej is TRUE
        - utbot_M3.closed_bias == BEARISH

    # ══════════════════════════════════════════════════════════
    # Strategy 2: M2 SELL 2nd Wave — EMA50 + bounce + VWAP
    # Backtest: PF 1.80, WR 64.7%, DD 10.4%, 34 trades
    # ══════════════════════════════════════════════════════════
    - name: "trend_2w_m2_ema50_bounce2_vwap"
      enabled: true
      priority: 50
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M2 SELL + EMA50 M5 below + M5 bounced 2+ bars + VWAP (no M15)"
      buy: []
      sell:
        - utbot_M2.closed_signal == SELL
        - ema50_M5.closed_price_vs_ema == BELOW
        - utbot_M5.consecutive_bull_bars >= 2
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 3: M2 SELL 2nd Wave — M15 bear + bounce + VWAP
    # Backtest: PF 1.62, WR 62.5%, DD 9.7%, 24 trades
    # ══════════════════════════════════════════════════════════
    - name: "trend_2w_m2_m15bear_bounce2_vwap"
      enabled: true
      priority: 50
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M2 SELL + M15 bearish + M5 bounced 2+ bars + VWAP"
      buy: []
      sell:
        - utbot_M2.closed_signal == SELL
        - utbot_M15.closed_bias == BEARISH
        - utbot_M5.consecutive_bull_bars >= 2
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 4: DC Second Wave — M45 bear + DC M15 upper pullback
    # Backtest 60d: PF 1.29, WR 57.6%, 59 trades, DD 30.6%
    # M3 SELL + M45 bearish + price in DC M15 UPPER zone + VWAP below
    # ══════════════════════════════════════════════════════════
    - name: "dc2w_m3_m45bear_dcupper_vwap"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M3 SELL + M45 bearish + DC M15 upper pullback + VWAP"
      buy: []
      sell:
        - utbot_M3.closed_signal == SELL
        - utbot_M45.closed_bias == BEARISH
        - dc_M15.closed_price_zone in UPPER,UPPER_MID
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 5: BUY — Hammer 2nd Wave at DC Lower
    # Backtest 60d: PF 1.20, WR 55.6%, 18 trades, DD 10.3%
    # M3 hammer + M5 pullback 2+ bars + M15 bullish + DC lower
    # ══════════════════════════════════════════════════════════
    - name: "hammer_2w_m15_dc"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M3 hammer + M5 pullback + M15 bull + DC lower"
      buy:
        - candle_M3.closed_candle_type == HAMMER
        - utbot_M5.consecutive_bear_bars >= 2
        - utbot_M15.closed_bias == BULLISH
        - dc_M15.closed_price_zone in LOWER,LOWER_MID
      sell: []

    # ══════════════════════════════════════════════════════════
    # Strategy 6: SELL — Doji at DC Upper
    # Backtest 60d: PF 1.31, WR 58.5%, 53 trades, DD 18.6%
    # M3 doji at DC M15 upper zone + M15 bearish bias
    # ══════════════════════════════════════════════════════════
    - name: "doji_dc_upper_m15"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M3 doji at DC upper + M15 bearish"
      buy: []
      sell:
        - candle_M3.closed_candle_type == DOJI
        - dc_M15.closed_price_zone in UPPER,UPPER_MID
        - utbot_M15.closed_bias == BEARISH

    # ══════════════════════════════════════════════════════════
    # Strategy 7: SELL — Shooting Star M5 + M15 Bearish
    # Backtest 60d: PF 1.29, WR 57.8%, 187 trades, DD 33.9%
    # M5 shooting star candle + M15 bearish bias
    # ══════════════════════════════════════════════════════════
    - name: "shstar_m5_m15"
      enabled: true
      priority: 50
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M5 shooting star + M15 bearish"
      buy: []
      sell:
        - candle_M5.closed_candle_type == SHOOTING_STAR
        - utbot_M15.closed_bias == BEARISH

    # ══════════════════════════════════════════════════════════
    # Strategy 8: SELL — Wick 2x + DC Upper + M45 Bear + VWAP
    # Backtest 60d: PF 1.32, WR 58.5%, 82 trades, DD 26.8%
    # M3 upper wick >=2x body + DC upper + M45 bearish + VWAP below
    # ══════════════════════════════════════════════════════════
    - name: "wick2x_dc_m45_vwap_sell"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "M3 wick>=2x + DC upper + M45 bear + VWAP below"
      buy: []
      sell:
        - candle_M3.closed_upper_wick_ratio >= 2
        - candle_M3.closed_is_bearish is TRUE
        - dc_M15.closed_price_zone in UPPER,UPPER_MID
        - utbot_M45.closed_bias == BEARISH
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Strategy 9: BUY — DC M5 Mid Hammer 2nd Wave
    # Backtest 60d: PF 1.75, WR 66.7%, 15 trades, DD 14.4%
    # M3 hammer + DC M5 mid zone + M5 pullback + M15 bullish
    # ══════════════════════════════════════════════════════════
    - name: "dc_mid_hammer_2w_m15"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "DC M5 mid zone + M5 pullback + M3 hammer + M15 bull"
      buy:
        - dc_M5.closed_price_zone == MIDDLE
        - utbot_M5.consecutive_bear_bars >= 2
        - candle_M3.closed_candle_type == HAMMER
        - utbot_M15.closed_bias == BULLISH
      sell: []

    # ══════════════════════════════════════════════════════════
    # Strategy 10: SELL — DC M5 Mid ShStar 2nd Wave
    # Backtest 60d: PF 1.72, WR 63.6%, 22 trades, DD 9.7%
    # M3 shooting star + DC M5 mid zone + M5 bounce + M15 bearish
    # ══════════════════════════════════════════════════════════
    - name: "dc_mid_shstar_2w_m15"
      enabled: true
      priority: 55
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "DC M5 mid zone + M5 bounce + M3 shstar + M15 bear"
      buy: []
      sell:
        - dc_M5.closed_price_zone == MIDDLE
        - utbot_M5.consecutive_bull_bars >= 2
        - candle_M3.closed_candle_type == SHOOTING_STAR
        - utbot_M15.closed_bias == BEARISH

    # ══════════════════════════════════════════════════════════
    # Strategy 11: BUY — DC M5 Lower-Mid Hammer 2nd Wave
    # Backtest 60d: PF 1.27, WR 57.5%, 40 trades, DD 14.9%
    # M3 hammer + DC M5 lower-mid/mid + M5 pullback + M15 bullish
    # ══════════════════════════════════════════════════════════
    - name: "dc_lowmid_hammer_2w_m15"
      enabled: true
      priority: 50
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "DC M5 lower-mid + M5 pullback + M3 hammer + M15 bull"
      buy:
        - dc_M5.closed_price_zone in LOWER_MID,MIDDLE
        - utbot_M5.consecutive_bear_bars >= 2
        - candle_M3.closed_candle_type == HAMMER
        - utbot_M15.closed_bias == BULLISH
      sell: []

    # ══════════════════════════════════════════════════════════
    # Strategy 12: SELL — DC M5 Upper-Mid ShStar 2nd Wave
    # Backtest 60d: PF 1.23, WR 56.0%, 50 trades, DD 27.0%
    # M3 shstar + DC M5 upper-mid/mid + M5 bounce + M15 bearish
    # ══════════════════════════════════════════════════════════
    - name: "dc_upmid_shstar_2w_m15"
      enabled: true
      priority: 50
      sl_dollars: 7.5
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "DC M5 upper-mid + M5 bounce + M3 shstar + M15 bear"
      buy: []
      sell:
        - dc_M5.closed_price_zone in UPPER_MID,MIDDLE
        - utbot_M5.consecutive_bull_bars >= 2
        - candle_M3.closed_candle_type == SHOOTING_STAR
        - utbot_M15.closed_bias == BEARISH

    # ══════════════════════════════════════════════════════════
    # Strategy 13: BUY — RSI2 + EMA200 + ADX + UT Bot H1
    # Backtest 60d: PF 1.40, WR 50.8%, 61 trades, DD 15.8%
    # Same RSI2 mean reversion but adds H1 bullish bias for extra filtering
    # ══════════════════════════════════════════════════════════
    - name: "rsi2_mean_rev_full"
      enabled: true
      priority: 110
      sl_dollars: 3.0
      reward_ratio: 1.5
      breakeven_pct: 0.0
      partial_tp: false
      description: "RSI2 M5 extreme OS + EMA200 + ADX trending + H1 bullish"
      buy:
        - rsi2_M5.closed_zone == EXTREME_OS
        - ema200_M15.closed_price_vs_ema == ABOVE
        - adx14_M15.closed_trend_strength in STRONG_TREND,TRENDING
        - utbot_H1.closed_bias == BULLISH
      sell: []

    # ══════════════════════════════════════════════════════════
    # Strategy 14: BUY — EMA50 Rising + DC Wick Rej + H1 Bullish
    # Backtest 60d: PF 1.88, WR 50.0%, 32 trades, DD 22.6%
    # Best structural bounce strategy found
    # ══════════════════════════════════════════════════════════
    - name: "ema50_dc_wick_h1"
      enabled: true
      priority: 110
      sl_dollars: 3.0
      reward_ratio: 2.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "EMA50 M15 rising + DC M15 wick rej + H1 bullish"
      buy:
        - ema50_M15.ema_slope == RISING
        - dc_M15.closed_lower_wick_rej is TRUE
        - utbot_H1.closed_bias == BULLISH
      sell: []

    # ══════════════════════════════════════════════════════════
    # Strategy 15: BUY — RSI2 + DC Wick Rej (high PF, fewer trades)
    # Backtest 60d: PF 4.27, WR 80.0%, 15 trades, DD 9.7%
    # Confluence of RSI2 oversold + structural wick rejection
    # ══════════════════════════════════════════════════════════
    - name: "rsi2_dc_wick"
      enabled: true
      priority: 120
      sl_dollars: 3.0
      reward_ratio: 1.0
      breakeven_pct: 0.0
      partial_tp: false
      description: "RSI2 M5 extreme OS + EMA200 above + DC M15 wick rej"
      buy:
        - rsi2_M5.closed_zone == EXTREME_OS
        - ema200_M15.closed_price_vs_ema == ABOVE
        - dc_M15.closed_lower_wick_rej is TRUE
      sell: []
