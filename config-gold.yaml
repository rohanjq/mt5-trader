# MT5 Auto-Trader — XAUUSD Gold Configuration
# Usage: python main.py --config config-gold.yaml

mt5:
  host: localhost
  port: 8001

trading:
  symbol: XAUUSD
  volume: 0.25           # fallback if risk sizing fails
  risk_pct: 5.0          # risk 5% of account balance per trade (hot-reloadable)
  max_volume: 10.0       # safety cap
  min_volume: 0.01       # broker minimum
  magic: 200             # separate magic from BTC (100)
  deviation: 20
  filling: FOK
  multi_position: true
  sl_dollars: 5.0         # default SL = $5.00 move (overridable per strategy)
  reward_ratio: 1.2        # default TP = SL × 1.2 (runners ride beyond)

signals:
  poll_interval: 2.0
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
    # ── Core indicators ──
    - indicator: utbot
      timeframes: [M1, M3, M5, M15]
    - indicator: dc
      timeframes: [M1, M5, M15]
    # ── EMA family ──
    - indicator: ema9
      timeframes: [M1]
    - indicator: ema21
      timeframes: [M1, M5]
    - indicator: ema50
      timeframes: [M5, M15]
    - indicator: ema200
      timeframes: [M5, M15]
    # ── Oscillators ──
    - indicator: rsi14
      timeframes: [M1, M5, M15]
    - indicator: rsi2
      timeframes: [M1]
    - indicator: adx
      timeframes: [M1, M5]
    - indicator: macd
      timeframes: [M1]
    - indicator: stoch
      timeframes: [M1]
    # ── Volatility / bands ──
    - indicator: bb
      timeframes: [M1]
    - indicator: atr
      timeframes: [M1, M5]
    # ── Session VWAP ──
    - indicator: vwap
      timeframes: [M1, M5]

filters:
  cooldown_seconds: 30
  max_consecutive_losses: 3
  pause_after_consecutive_minutes: 15
  max_daily_loss: -1
  reversal_cooldown_seconds: 30

exit_rules:
  signal_reversal_exit: false
  breakeven_pct: 60.0           # move SL to entry at 60% of risk
  partial_tp: true              # 80/20 split
  tp_close_pct: 80.0
  trailing_stop_dollars: 0.0

notifications:
  enabled: true
  pushover_user_key: ""    # set via PUSHOVER_USER env var
  pushover_app_token: ""    # set via PUSHOVER_TOKEN env var

rules:
  expressions:
    # ══════════════════════════════════════════════════════════
    # Gold Strategy 1: VWAP Pullback Continuation (highest priority)
    # Research: best blend of win rate (51-58%) and frequency.
    # Enters after pullback into VWAP zone in established M5 trend.
    # SL: $3.50 (tighter, pullback = lower noise), RR 1:1.25
    # ══════════════════════════════════════════════════════════
    - name: "gold_vwap_pullback"
      enabled: true
      priority: 30
      sl_dollars: 3.5
      reward_ratio: 1.25
      breakeven_pct: 55.0
      partial_tp: true
      description: "VWAP pullback continuation (M5 trend + M1 RSI reclaim)"
      buy:
        - ema200_M15.closed_price_vs_ema == ABOVE
        - ema21_M5.closed_price_vs_ema == ABOVE
        - ema50_M5.closed_price_vs_ema == ABOVE
        - adx_M5.closed_trend_strength in WEAK_TREND,TRENDING,STRONG_TREND
        - rsi2_M1.closed_zone == EXTREME_OS
        - ema9_M1.closed_price_vs_ema == ABOVE
        - rsi14_M1.closed_rsi > 50
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - ema200_M15.closed_price_vs_ema == BELOW
        - ema21_M5.closed_price_vs_ema == BELOW
        - ema50_M5.closed_price_vs_ema == BELOW
        - adx_M5.closed_trend_strength in WEAK_TREND,TRENDING,STRONG_TREND
        - rsi2_M1.closed_zone == EXTREME_OB
        - ema9_M1.closed_price_vs_ema == BELOW
        - rsi14_M1.closed_rsi < 50
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Gold Strategy 2: Session Impulse EMA ADX (trend following)
    # Research: strongest directional quality, win rate 43-49%.
    # All TFs aligned + ADX trending + ATR expanding + above VWAP.
    # SL: $5.00 (wider for trend), RR 1:1.5
    # ══════════════════════════════════════════════════════════
    - name: "gold_session_impulse"
      enabled: true
      priority: 35
      sl_dollars: 5.0
      reward_ratio: 1.5
      breakeven_pct: 50.0
      partial_tp: true
      description: "Session impulse EMA ADX trend (M5 regime + M1 momentum)"
      buy:
        - ema200_M5.closed_price_vs_ema == ABOVE
        - ema50_M5.closed_price_vs_ema == ABOVE
        - ema50_M5.ema_slope == RISING
        - rsi14_M5.closed_rsi > 55
        - ema9_M1.closed_price_vs_ema == ABOVE
        - ema21_M1.closed_price_vs_ema == ABOVE
        - adx_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - adx_M1.closed_di_bias == BULLISH
        - atr_M1.volatility_state in EXPANDING,ABOVE_AVG
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - ema200_M5.closed_price_vs_ema == BELOW
        - ema50_M5.closed_price_vs_ema == BELOW
        - ema50_M5.ema_slope == FALLING
        - rsi14_M5.closed_rsi < 45
        - ema9_M1.closed_price_vs_ema == BELOW
        - ema21_M1.closed_price_vs_ema == BELOW
        - adx_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - adx_M1.closed_di_bias == BEARISH
        - atr_M1.volatility_state in EXPANDING,ABOVE_AVG
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Gold Strategy 3: Compression to Expansion Donchian Breakout
    # Research: lower win rate (38-46%) but high RR 1:1.8.
    # DC compressed + BB squeezed + ATR expanding + breakout.
    # SL: $6.00 (wider for breakout), RR 1:1.8
    # ══════════════════════════════════════════════════════════
    - name: "gold_dc_breakout"
      enabled: true
      priority: 40
      sl_dollars: 6.0
      reward_ratio: 1.8
      breakeven_pct: 45.0
      partial_tp: true
      description: "Compression breakout (DC+BB squeeze → expansion)"
      buy:
        - ema50_M5.closed_price_vs_ema == ABOVE
        - ema200_M5.closed_price_vs_ema == ABOVE
        - dc_M1.dc_compressed is TRUE
        - bb_M1.bb_squeeze is TRUE
        - atr_M1.volatility_state in EXPANDING,ABOVE_AVG
        - dc_M1.closed_price_zone == UPPER
        - adx_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - ema50_M5.closed_price_vs_ema == BELOW
        - ema200_M5.closed_price_vs_ema == BELOW
        - dc_M1.dc_compressed is TRUE
        - bb_M1.bb_squeeze is TRUE
        - atr_M1.volatility_state in EXPANDING,ABOVE_AVG
        - dc_M1.closed_price_zone == LOWER
        - adx_M1.closed_trend_strength in TRENDING,STRONG_TREND
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Gold Strategy 4: Bollinger VWAP Range Fade (mean reversion)
    # Research: highest win rate (57-64%), but fragile on trend days.
    # Only fires when ADX ranging + near VWAP + BB re-entry.
    # SL: $3.00 (tight for range), RR 1:1.0
    # ══════════════════════════════════════════════════════════
    - name: "gold_bb_range_fade"
      enabled: true
      priority: 45
      sl_dollars: 3.0
      reward_ratio: 1.0
      breakeven_pct: 65.0
      partial_tp: false       # scalp — lock in full profit at TP
      description: "BB VWAP range fade (ADX ranging + BB re-entry)"
      buy:
        - adx_M5.closed_trend_strength == RANGING
        - rsi14_M15.closed_rsi > 45
        - rsi14_M15.closed_rsi < 55
        - bb_M1.closed_reenter_from_below is TRUE
        - bb_M1.bb_squeeze is_not TRUE
        - vwap_M1.running_dist_pct < 0.03
        - vwap_M1.running_dist_pct > -0.03
      sell:
        - adx_M5.closed_trend_strength == RANGING
        - rsi14_M15.closed_rsi > 45
        - rsi14_M15.closed_rsi < 55
        - bb_M1.closed_reenter_from_above is TRUE
        - bb_M1.bb_squeeze is_not TRUE
        - vwap_M1.running_dist_pct < 0.03
        - vwap_M1.running_dist_pct > -0.03

    # ══════════════════════════════════════════════════════════
    # Gold Strategy 5: UT Bot multi-TF trend (simple fallback)
    # Classic UT Bot signal with higher TF alignment.
    # SL: $5.00, RR 1:1.25
    # ══════════════════════════════════════════════════════════
    - name: "gold_utbot_trend"
      enabled: true
      priority: 50
      sl_dollars: 5.0
      reward_ratio: 1.25
      breakeven_pct: 55.0
      partial_tp: true
      description: "UT Bot M1 signal + M5/M15 trend alignment"
      buy:
        - utbot_M1.closed_signal == BUY
        - utbot_M5.closed_bias == BULLISH
        - utbot_M15.closed_bias == BULLISH
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - utbot_M1.closed_signal == SELL
        - utbot_M5.closed_bias == BEARISH
        - utbot_M15.closed_bias == BEARISH
        - vwap_M1.closed_price_vs_vwap == BELOW

    # ══════════════════════════════════════════════════════════
    # Gold Strategy 6: EMA pullback with VWAP
    # M5 trend + RSI dip recovery + above VWAP confirmation.
    # SL: $4.00, RR 1:1.25
    # ══════════════════════════════════════════════════════════
    - name: "gold_ema_pullback"
      enabled: true
      priority: 42
      sl_dollars: 4.0
      reward_ratio: 1.25
      breakeven_pct: 55.0
      partial_tp: true
      description: "EMA pullback + VWAP filter (M5 trend + M1 RSI)"
      buy:
        - ema50_M5.closed_price_vs_ema == ABOVE
        - ema200_M5.closed_price_vs_ema == ABOVE
        - ema50_M5.ema_slope == RISING
        - rsi14_M1.closed_cross in CROSS_UP_50,CROSS_UP_52
        - vwap_M1.closed_price_vs_vwap == ABOVE
      sell:
        - ema50_M5.closed_price_vs_ema == BELOW
        - ema200_M5.closed_price_vs_ema == BELOW
        - ema50_M5.ema_slope == FALLING
        - rsi14_M1.closed_cross == CROSS_DOWN_50
        - vwap_M1.closed_price_vs_vwap == BELOW
