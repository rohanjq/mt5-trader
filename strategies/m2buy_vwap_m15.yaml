mt5:
  host: localhost
  port: 8001
trading:
  symbol: XAUUSD
  volume: 0.25
  risk_pct: 5.0
  max_volume: 10.0
  min_volume: 0.01
  magic: 290
  deviation: 20
  filling: FOK
  multi_position: true
  sl_dollars: 7.5
  reward_ratio: 1.0
signals:
  poll_interval: 2.0
  csv_dir: ../MetaTrader5-Docker/data/signals
  sources:
  - indicator: utbot
    timeframes:
    - M1
    - M2
    - M3
    - M5
    - M10
    - M15
    - M45
    - H1
  - indicator: dc
    timeframes:
    - M1
    - M5
    - M15
  - indicator: ema9
    timeframes:
    - M1
    - M2
    - M5
    - M15
  - indicator: ema21
    timeframes:
    - M1
    - M2
    - M5
    - M15
  - indicator: ema50
    timeframes:
    - M1
    - M5
    - M15
  - indicator: ema200
    timeframes:
    - M1
    - M5
    - M15
  - indicator: rsi14
    timeframes:
    - M1
    - M2
    - M5
    - M15
  - indicator: rsi2
    timeframes:
    - M1
    - M2
    - M5
  - indicator: adx14
    timeframes:
    - M1
    - M5
    - M15
  - indicator: vwap
    timeframes:
    - M1
    - M5
    - M15
  - indicator: atr14
    timeframes:
    - M1
    - M5
    - M15
filters:
  cooldown_seconds: 30
  max_consecutive_losses: 0
  pause_after_consecutive_minutes: 0
  max_daily_loss: -1
  reversal_cooldown_seconds: 30
exit_rules:
  signal_reversal_exit: false
  breakeven_pct: 0.0
  partial_tp: false
  tp_close_pct: 100.0
  trailing_stop_dollars: 0.0
notifications:
  enabled: false
rules:
  expressions:
  - name: m2buy_vwap_m15
    enabled: true
    priority: 50
    sl_dollars: 7.5
    reward_ratio: 1.0
    breakeven_pct: 0.0
    partial_tp: false
    description: m2buy_vwap_m15
    buy:
    - utbot_M2.closed_signal == BUY
    - vwap_M1.closed_price_vs_vwap == ABOVE
    - utbot_M15.closed_bias == BULLISH
    sell:
    - utbot_M2.closed_signal == BUY
    - utbot_M2.closed_signal == SELL
