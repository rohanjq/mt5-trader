[project]
name = "mt5-trader"
version = "0.1.0"
description = "Automated BTCUSDT trading system for MetaTrader 5 via rpyc bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mt5linux>=0.2.0",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "rpyc==5.3.1",
    "textual>=8.2.7",
    "watchdog>=6.0.0",
]

[project.scripts]
mt5-trader = "main:main"
